<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12141a">
<title>Rivalis · Personagem</title>
<style>
:root{
  --bg:#12141a; --panel:#1b1e27; --panel2:#232735; --line:#2f3445; --text:#e9ebf2; --mute:#9aa1b5;
  --res:#3b82f6; --spy:#ef4444; --ok:#22c55e; --gold:#eab308; --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:820px;margin:0 auto;padding:16px 16px calc(28px + env(safe-area-inset-bottom))}
h1{font-size:22px;margin:0}
h3{font-size:13px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;margin:0 0 8px}
p{margin:6px 0}
.mute{color:var(--mute)} .small{font-size:13px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;cursor:pointer;min-height:44px}
button:active{transform:scale(.97)}
button.primary{background:var(--res);border-color:var(--res);font-weight:700}
button.chip{padding:7px 12px;min-height:38px;border-radius:999px;font-size:14px}
button.chip.on{background:var(--res);border-color:var(--res);font-weight:700}
.hero{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.hero .big{background:var(--panel2);border-radius:50%;padding:6px;line-height:0;border:2px solid var(--line)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{white-space:nowrap}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.opt{background:var(--panel2);border:2px solid var(--line);border-radius:12px;padding:6px 4px;cursor:pointer;text-align:center;line-height:1}
.opt.on{border-color:var(--gold);background:#3a3212}
.opt svg{display:block;margin:0 auto;border-radius:50%}
.opt .lb{display:block;font-size:11px;color:var(--mute);margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opt.on .lb{color:var(--text)}
.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px}
.swatch{border:2px solid var(--line);border-radius:12px;padding:8px 4px;background:var(--panel2);cursor:pointer;text-align:center}
.swatch.on{border-color:var(--gold)}
.swatch i{display:block;width:100%;height:26px;border-radius:8px;border:1px solid #0004}
.swatch .lb{display:block;font-size:11px;color:var(--mute);margin-top:5px}
code{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:3px 8px;font-size:13px;word-break:break-all}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:10px}
</style>
</head>
<body>
<div id="app">
  <div class="row" style="justify-content:space-between;margin-bottom:12px">
    <h1>Monte seu personagem</h1>
    <button class="chip" id="galeria">Ver exemplos</button>
  </div>

  <div class="card hero">
    <div class="big" id="preview"></div>
    <div style="flex:1;min-width:200px">
      <div class="row">
        <button class="primary" id="sortear">🎲 Sortear</button>
        <button id="copiar">Copiar código</button>
      </div>
      <p class="small mute" style="margin-top:10px">Código do personagem:<br><code id="codigo"></code></p>
    </div>
  </div>

  <div class="card">
    <div class="tabs" id="tabs"></div>
    <div id="painel"></div>
  </div>

  <div class="card" id="galeriaBox" hidden>
    <h3>Exemplos aleatórios</h3>
    <div class="grid" id="galeriaGrid"></div>
  </div>

  <p class="small mute">Esta tela é só o editor. O jogo (<code>index.html</code>) não foi alterado: ele usa o mesmo <code>avatar.js</code> quando a gente ligar as duas coisas.</p>
</div>

<script src="avatar.js"></script>
<script>
'use strict';
const $ = id => document.getElementById(id);
const SAVE = 'rivalis-avatar';

let cfg;
try{ cfg = Avatar.parse(localStorage.getItem(SAVE) || ''); }catch(e){ cfg = null; }
if(!cfg || !localStorage.getItem(SAVE)) cfg = Avatar.random();

let tab = 'face';

function save(){ try{ localStorage.setItem(SAVE, Avatar.code(cfg)); }catch(e){} }

function renderPreview(){
  $('preview').innerHTML = Avatar.svg(cfg, {size:150});
  $('codigo').textContent = Avatar.code(cfg);
}
function renderTabs(){
  $('tabs').innerHTML = Avatar.KEYS
    .map(k => `<button class="chip ${k===tab?'on':''}" data-tab="${k}">${Avatar.PARTS[k].name}</button>`).join('');
}
function renderPainel(){
  const part = Avatar.PARTS[tab];
  if(part.color){
    $('painel').innerHTML = `<div class="sw">${part.list.map((o,i)=>`
      <div class="swatch ${cfg[tab]===i?'on':''}" data-i="${i}" role="button" tabindex="0">
        <i style="background:${o.c}"></i><span class="lb">${o.name}</span>
      </div>`).join('')}</div>`;
  } else {
    $('painel').innerHTML = `<div class="opts">${part.list.map((o,i)=>{
      const mini = Avatar.svg(Object.assign({}, cfg, {[tab]:i}), {size:66});
      return `<div class="opt ${cfg[tab]===i?'on':''}" data-i="${i}" role="button" tabindex="0">
        ${mini}<span class="lb">${o.name}</span></div>`;
    }).join('')}</div>`;
  }
}
function render(){ renderPreview(); renderTabs(); renderPainel(); save(); }

document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab]');
  if(t){ tab = t.dataset.tab; renderTabs(); renderPainel(); return; }
  const o = e.target.closest('[data-i]');
  if(o){ cfg[tab] = +o.dataset.i; render(); return; }
});
$('sortear').onclick = () => { cfg = Avatar.random(); render(); };
$('copiar').onclick = async () => {
  const txt = Avatar.code(cfg);
  try{ await navigator.clipboard.writeText(txt); $('copiar').textContent = 'Copiado!'; }
  catch(e){ $('copiar').textContent = txt; }
  setTimeout(()=>$('copiar').textContent = 'Copiar código', 1500);
};
$('galeria').onclick = () => {
  const box = $('galeriaBox');
  box.hidden = !box.hidden;
  if(!box.hidden){
    $('galeriaGrid').innerHTML = Array.from({length:12}, () => {
      const c = Avatar.random();
      return `<div style="text-align:center"><div style="line-height:0">${Avatar.svg(c,{size:66})}</div></div>`;
    }).join('');
  }
};
render();
</script>
</body>
</html>
