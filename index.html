<html lang="pt-BR">
<head>
<meta charset="utf-8">

<style>
:root{
  --bg:#12141a; --panel:#1b1e27; --panel2:#232735; --line:#2f3445; --text:#e9ebf2; --mute:#9aa1b5;
  --res:#3b82f6; --res2:#1e3a8a; --spy:#ef4444; --spy2:#7f1d1d; --ok:#22c55e; --warn:#f59e0b; --gold:#eab308;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100dvh}
#app{max-width:1100px;margin:0 auto;padding:16px 16px calc(24px + env(safe-area-inset-bottom))}
h1,h2,h3{margin:0 0 8px;line-height:1.2}
h1{font-size:28px;letter-spacing:.5px}
h2{font-size:20px}
h3{font-size:16px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
p{margin:6px 0}
.mute{color:var(--mute)}
.small{font-size:13px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.col{display:flex;flex-direction:column;gap:10px}
.grid2{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:860px){.grid2{grid-template-columns:1.35fr 1fr}}
button{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 16px;cursor:pointer;min-height:46px;transition:transform .05s,background .15s}
button:active{transform:scale(.97)}
button:disabled{opacity:.4;cursor:not-allowed}
button.primary{background:var(--res);border-color:var(--res);font-weight:700}
button.danger{background:var(--spy);border-color:var(--spy);font-weight:700}
button.ok{background:var(--ok);border-color:var(--ok);color:#06200f;font-weight:700}
button.ghost{background:transparent}
button.big{width:100%;font-size:18px;min-height:56px}
button.chip{padding:8px 12px;min-height:38px;border-radius:999px;font-size:14px}
button.chip.on{background:var(--res);border-color:var(--res)}
button.tpl{text-align:left;width:100%}
input{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%;min-height:48px}
input:focus{outline:2px solid var(--res);outline-offset:1px}
label{font-size:13px;color:var(--mute);display:block;margin-bottom:4px}
.logo{font-size:40px;font-weight:900;letter-spacing:2px;background:linear-gradient(90deg,var(--res),#a78bfa,var(--spy));-webkit-background-clip:text;background-clip:text;color:transparent}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.code{font-family:ui-monospace,Menlo,monospace;font-size:34px;font-weight:800;letter-spacing:6px}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:13px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--mute);display:inline-block}
.dot.on{background:var(--ok)} .dot.off{background:var(--spy)}
.track{display:flex;gap:8px;justify-content:center;margin:6px 0 10px}
.m{width:52px;height:52px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;flex-direction:column;font-weight:800;position:relative;background:var(--panel2)}
.m small{font-size:10px;font-weight:600;color:var(--mute)}
.m.cur{border-color:var(--gold);box-shadow:0 0 0 3px #eab30833}
.m.S{background:var(--res);border-color:var(--res)} .m.F{background:var(--spy);border-color:var(--spy)}
.m.S small,.m.F small{color:#fff}
.m .two{position:absolute;bottom:-6px;right:-6px;background:var(--warn);color:#000;font-size:10px;border-radius:999px;padding:1px 5px}
.rej{display:flex;gap:6px;justify-content:center;align-items:center;font-size:13px;color:var(--mute)}
.rej i{width:14px;height:14px;border-radius:4px;border:1px solid var(--line);display:inline-block}
.rej i.x{background:var(--warn);border-color:var(--warn)}
.players{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.pl{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;align-items:center;gap:8px;min-height:50px;text-align:left;width:100%}
.pl.sel{border-color:var(--gold);background:#3a3212}
.pl.spy{box-shadow:inset 3px 0 0 var(--spy)} .pl.resr{box-shadow:inset 3px 0 0 var(--res)}
.pl .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.role{border-radius:var(--r);padding:18px;text-align:center;cursor:pointer;user-select:none;border:1px solid var(--line)}
.role.hid{background:repeating-linear-gradient(45deg,#1b1e27,#1b1e27 10px,#20242f 10px,#20242f 20px)}
.role.R{background:linear-gradient(135deg,var(--res2),#0f172a);border-color:var(--res)}
.role.S{background:linear-gradient(135deg,var(--spy2),#1c0a0a);border-color:var(--spy)}
.role .t{font-size:24px;font-weight:900;margin:4px 0}
.phase{border-left:4px solid var(--gold)}
.tabs{display:flex;gap:8px;margin-bottom:12px;position:sticky;top:0;background:var(--bg);padding:6px 0;z-index:5}
.tabs button{flex:1;position:relative}
.tabs button.on{background:var(--res);border-color:var(--res);font-weight:700}
.badge{position:absolute;top:-6px;right:-6px;background:var(--spy);color:#fff;border-radius:999px;font-size:12px;padding:1px 7px;font-weight:700}
.feed{display:flex;flex-direction:column;gap:6px;max-height:60vh;overflow:auto}
.msg{background:var(--panel2);border-radius:10px;padding:8px 10px;border-left:3px solid var(--line)}
.msg.accuse{border-left-color:var(--spy)} .msg.defend{border-left-color:var(--ok)} .msg.say{border-left-color:var(--res)} .msg.sys{background:transparent;border-left-color:var(--gold);color:var(--mute);font-size:14px}
.msg b{margin-right:4px}
.vt{display:grid;grid-template-columns:1fr auto;gap:4px 10px}
.cards{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.mc{width:64px;height:90px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900;animation:flip .5s both}
.mc.S{background:var(--res)} .mc.F{background:var(--spy)}
@keyframes flip{from{transform:rotateY(90deg);opacity:0}to{transform:none;opacity:1}}
.banner{text-align:center;padding:22px;border-radius:var(--r);font-size:26px;font-weight:900}
.banner.R{background:linear-gradient(135deg,var(--res2),var(--res))} .banner.S{background:linear-gradient(135deg,var(--spy2),var(--spy))}
.qr{background:#fff;border-radius:10px;padding:6px;display:inline-block;line-height:0}
.qr svg{width:150px;height:150px}
.warn{background:#3a2a07;border:1px solid var(--warn);border-radius:10px;padding:10px;font-size:14px}
.err{background:#3a0d0d;border:1px solid var(--spy);border-radius:10px;padding:10px;font-size:14px}
.switch{display:flex;align-items:center;gap:10px}
details summary{cursor:pointer;color:var(--mute)}
.link{word-break:break-all;font-size:13px;color:var(--mute)}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
/* ================== Utilidades ================== */
const $app = document.getElementById('app');
const Q = new URLSearchParams(location.search);
const LOCAL = Q.has('local');                 // ?local=1 → teste em abas do mesmo navegador
const PREFIX = 'resistencia-jogo-v1-';
function mkStore(kind){ return {
  get(k){ try{ return JSON.parse(window[kind].getItem(k)); }catch(e){ return null; } },
  set(k,v){ try{ window[kind].setItem(k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ window[kind].removeItem(k); }catch(e){} } }; }
const store = mkStore('localStorage');
const pstore = LOCAL ? mkStore('sessionStorage') : store;   // no modo local cada aba é um jogador
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function rnd(n, abc){ let s=''; const r=crypto.getRandomValues(new Uint8Array(n)); for(const x of r) s+=abc[x%abc.length]; return s; }
const rid = (n=10) => rnd(n,'abcdefghijkmnpqrstuvwxyz23456789');
const newCode = () => rnd(4,'ABCDEFGHJKLMNPQRSTUVWXYZ');
const shuffle = arr => { const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
function joinUrl(code){ return location.origin + location.pathname + '?sala=' + code + (LOCAL ? '&local=1' : ''); }

/* ================== Regras ================== */
// Tamanho das equipes por missão e nº de espiões (tabela do jogo original; 3–4 = modo teste)
const TABLE = {
  3:{spies:1,sizes:[1,2,2,2,2]},
  4:{spies:1,sizes:[2,2,2,3,3]},
  5:{spies:2,sizes:[2,3,2,3,3]},
  6:{spies:2,sizes:[2,3,4,3,4]},
  7:{spies:3,sizes:[2,3,3,4,4]},
  8:{spies:3,sizes:[3,4,4,5,5]},
  9:{spies:3,sizes:[3,4,4,5,5]},
  10:{spies:4,sizes:[3,4,4,5,5]},
};
const sabs = n => n===1 ? '1 sabotagem' : n+' sabotagens';
const needsTwo = (n,i) => n >= 7 && i === 3;   // 4ª missão com 7+ jogadores precisa de 2 sabotagens

// Textos prontos da conversa. {X} = jogador escolhido
const TPL = {
  accuse:[
    'Acho que {X} é espião.',
    '{X} votou estranho na última votação.',
    'Não confio em {X} nessa equipe.',
    '{X} estava na missão que falhou.',
    '{X} está quieto demais...',
    '{X} está defendendo espião, certeza.',
  ],
  defend:[
    'Confio em {X}.',
    '{X} estava numa missão que deu certo.',
    'Coloco minha mão no fogo por {X}.',
    'Deixem {X} em paz, não tem prova nenhuma.',
    '{X} deveria entrar na próxima equipe.',
  ],
  say:[
    'Eu sou da resistência!',
    'Não sou espião, juro!',
    'Quero entrar na próxima equipe.',
    'Aprovem essa equipe!',
    'Rejeitem essa equipe!',
    'Tem espião nessa equipe.',
    'Alguém aqui está mentindo.',
    'Confiem em mim.',
    'Vamos com calma, pensem bem.',
  ],
};
const KIND_LABEL = {accuse:'Acusar', defend:'Defender', ally:'Aliança', say:'Falar'};

/* ================== Rede ================== */
// Mestre = servidor. Jogadores conectam direto no aparelho do mestre (WebRTC via PeerJS).
function hostNet(code, h){
  if(LOCAL){
    const bc = new BroadcastChannel(PREFIX+code);
    bc.onmessage = e => { const x=e.data; if(!x || x.to!=='host') return; if(x.d && x.d.t==='bye') h.onLeave(x.from); else h.onMsg(x.from, x.d); };
    setTimeout(h.onReady, 0);
    return { send(k,m){ bc.postMessage({to:k, d:m}); }, drop(){} };
  }
  if(typeof Peer === 'undefined'){ setTimeout(()=>h.onError('Não foi possível carregar a conexão. Verifique a internet e recarregue.'),0); return {send(){},drop(){}}; }
  const conns = {}; let peer;
  const open = () => {
    peer = new Peer(PREFIX+code);
    peer.on('open', () => h.onReady());
    peer.on('connection', c => {
      conns[c.connectionId] = c;
      c.on('data', m => h.onMsg(c.connectionId, m));
      c.on('close', () => { delete conns[c.connectionId]; h.onLeave(c.connectionId); });
      c.on('error', () => {});
    });
    peer.on('disconnected', () => { if(!peer.destroyed) setTimeout(()=>{ try{ peer.reconnect(); }catch(e){} }, 1500); });
    peer.on('error', e => {
      if(e.type === 'unavailable-id'){ h.onError('Reabrindo a sala… aguarde alguns segundos.'); peer.destroy(); setTimeout(open, 3000); }
      else if(['network','server-error','socket-error','socket-closed'].includes(e.type)) h.onError('Sem conexão com o servidor. Tentando de novo…');
    });
  };
  open();
  return {
    send(k,m){ const c=conns[k]; if(c && c.open){ try{ c.send(m); }catch(e){} } },
    drop(k){ const c=conns[k]; if(c){ try{ c.close(); }catch(e){} } },
  };
}

function clientNet(code, h){
  if(LOCAL){
    const me = rid();
    const bc = new BroadcastChannel(PREFIX+code);
    bc.onmessage = e => { if(e.data && e.data.to===me) h.onMsg(e.data.d); };
    addEventListener('pagehide', () => bc.postMessage({to:'host', from:me, d:{t:'bye'}}));
    setTimeout(()=>h.onStatus('open'), 0);
    return { send(m){ bc.postMessage({to:'host', from:me, d:m}); } };
  }
  if(typeof Peer === 'undefined'){ setTimeout(()=>h.onStatus('nolib'),0); return {send(){}}; }
  let peer, conn, timer = null;
  const retry = () => { if(timer) return; h.onStatus('retry'); timer = setTimeout(()=>{ timer=null; start(); }, 2500); };
  const start = () => {
    try{ peer && peer.destroy(); }catch(e){}
    conn = null;
    peer = new Peer();
    peer.on('open', () => {
      conn = peer.connect(PREFIX+code, {reliable:true});
      conn.on('open', () => h.onStatus('open'));
      conn.on('data', m => h.onMsg(m));
      conn.on('close', retry);
      conn.on('error', retry);
    });
    peer.on('error', e => { if(e.type==='peer-unavailable') h.onStatus('nohost'); retry(); });
  };
  start();
  document.addEventListener('visibilitychange', () => {
    if(!document.hidden && (!conn || !conn.open)){ clearTimeout(timer); timer=null; start(); }
  });
  return { send(m){ if(conn && conn.open){ try{ conn.send(m); }catch(e){} } } };
}

/* ================== MESTRE ================== */
let H = null, hnet = null;
const keyOf = {}, cidOf = {}, lastChat = {};
const hostUI = { showRoles:false, status:'Conectando…', ready:false };

function newHostState(code){
  return { code, phase:'lobby', players:[], voteOn:true, roles:{}, missions:[], round:0, rejects:0,
    team:[], votes:{}, voteReveal:null, mission:{}, missionReveal:null, chat:[], alliances:[], allyReqs:[],
    winner:null, winReason:'', history:[], seq:0 };
}
const saveHost = () => store.set('resist-host', H);
const pname = cid => (H.players.find(p=>p.cid===cid) || {}).name || '?';
const isPlayer = cid => H.players.some(p=>p.cid===cid);
const online = cid => !!keyOf[cid];
const allyOf = cid => { const a=H.alliances.find(x=>x.includes(cid)); return a ? (a[0]===cid ? a[1] : a[0]) : null; };
function addChat(c){ c.id = ++H.seq; c.at = Date.now(); H.chat.push(c); if(H.chat.length>80) H.chat.splice(0, H.chat.length-80); }
const sys = text => addChat({kind:'sys', text});

function pub(){
  const n = H.players.length;
  return {
    code:H.code, phase:H.phase, voteOn:H.voteOn,
    players:H.players.map(p=>({cid:p.cid, name:p.name, on:online(p.cid)})),
    missions:H.missions, round:H.round, rejects:H.rejects, team:H.team,
    voted: H.phase==='vote' ? Object.keys(H.votes) : [],
    voteReveal:H.voteReveal,
    acted: (H.phase==='mission' || H.phase==='missionDone') ? Object.keys(H.mission).length : 0,
    missionReveal:H.missionReveal, chat:H.chat.slice(-50), alliances:H.alliances,
    winner:H.winner, winReason:H.winReason, roles: H.phase==='end' ? H.roles : null,
    spyCount: H.phase==='lobby' ? (TABLE[n] ? TABLE[n].spies : 0) : Object.values(H.roles).filter(r=>r==='S').length,
  };
}
function stateFor(cid){
  const s = pub(); const role = H.roles[cid] || null;
  s.me = { cid, name:pname(cid), role,
    spies: role==='S' ? H.players.filter(p=>H.roles[p.cid]==='S' && p.cid!==cid).map(p=>p.name) : [],
    ally: allyOf(cid),
    incoming: H.allyReqs.filter(r=>r.to===cid).map(r=>r.from),
    outgoing: H.allyReqs.filter(r=>r.from===cid).map(r=>r.to),
    voted: cid in H.votes, myVote: H.votes[cid] || null, acted: cid in H.mission };
  return s;
}
function sync(){
  saveHost();
  for(const cid in keyOf) hnet.send(keyOf[cid], {t:'state', s:stateFor(cid)});
  render();
}

function hello(key, m){
  const name = String(m.name||'').trim().slice(0,16);
  if(!name) return hnet.send(key, {t:'error', msg:'Digite um nome.'});
  const reqCid = (typeof m.cid==='string' && /^[a-z0-9]{4,20}$/.test(m.cid)) ? m.cid : rid();
  let p = H.players.find(p=>p.cid===reqCid);
  if(!p && H.phase!=='lobby'){
    // voltou com outro aparelho/navegador: reconecta pelo nome se esse jogador estiver offline
    p = H.players.find(q=>q.name.toLowerCase()===name.toLowerCase() && !online(q.cid));
    if(!p) return hnet.send(key, {t:'error', msg:'A partida já começou. Aguarde a próxima partida.'});
  }
  if(!p){
    if(H.players.length >= 10) return hnet.send(key, {t:'error', msg:'Sala cheia (máximo 10 jogadores).'});
    let nm = name, i = 2;
    while(H.players.some(q=>q.name.toLowerCase()===nm.toLowerCase())) nm = name+' '+(i++);
    p = {cid:reqCid, name:nm}; H.players.push(p);
    sys(`👋 ${nm} entrou na sala.`);
  } else if(H.phase==='lobby' && p.name!==name && !H.players.some(q=>q!==p && q.name.toLowerCase()===name.toLowerCase())){
    p.name = name;
  }
  const old = keyOf[p.cid];
  if(old && old!==key){ delete cidOf[old]; hnet.drop(old); }
  keyOf[p.cid] = key; cidOf[key] = p.cid;
  hnet.send(key, {t:'welcome', cid:p.cid});
  sync();
}
function hostOnLeave(key){
  const cid = cidOf[key]; if(!cid) return;
  delete cidOf[key]; if(keyOf[cid]===key) delete keyOf[cid];
  sync();
}
function formAlliance(a,b){
  H.allyReqs = H.allyReqs.filter(r=>![a,b].includes(r.from) && ![a,b].includes(r.to));
  H.alliances.push([a,b]);
  sys(`🤝 ${pname(a)} e ${pname(b)} agora são aliados.`);
}
function hostOnMsg(key, m){
  if(!m || typeof m!=='object') return;
  if(m.t==='hello') return hello(key, m);
  const cid = cidOf[key]; if(!cid || !isPlayer(cid)) return;
  switch(m.t){
    case 'vote':
      if(H.phase!=='vote' || !['A','R','F'].includes(m.v) || (cid in H.votes)) return;
      if(m.v==='F' && !allyOf(cid)) return;
      H.votes[cid] = m.v;
      if(Object.keys(H.votes).length >= H.players.length) resolveVote();
      return sync();
    case 'mission':
      if(H.phase!=='mission' || !H.team.includes(cid) || (cid in H.mission) || !['S','F'].includes(m.v)) return;
      H.mission[cid] = H.roles[cid]==='S' ? m.v : 'S';   // resistência sempre joga sucesso
      if(Object.keys(H.mission).length >= H.team.length) H.phase = 'missionDone';
      return sync();
    case 'chat': {
      const list = TPL[m.kind]; if(!list) return;
      const tpl = list[m.i|0]; if(!tpl) return;
      let text = tpl;
      if(tpl.includes('{X}')){ if(!isPlayer(m.target) || m.target===cid) return; text = tpl.replace('{X}', pname(m.target)); }
      if(Date.now() - (lastChat[cid]||0) < 1200) return;
      lastChat[cid] = Date.now();
      addChat({kind:m.kind, from:cid, target:m.target||null, text});
      return sync();
    }
    case 'ally_req': {
      const t = m.target;
      if(!isPlayer(t) || t===cid || allyOf(cid) || allyOf(t)) return;
      if(H.allyReqs.some(r=>r.from===t && r.to===cid)) formAlliance(t, cid);   // pedido cruzado = aceite
      else {
        H.allyReqs = H.allyReqs.filter(r=>r.from!==cid);
        H.allyReqs.push({from:cid, to:t});
        sys(`🤝 ${pname(cid)} propôs aliança a ${pname(t)}.`);
      }
      return sync();
    }
    case 'ally_resp': {
      const r = H.allyReqs.find(r=>r.from===m.from && r.to===cid); if(!r) return;
      if(m.accept && !allyOf(cid) && !allyOf(m.from)) formAlliance(m.from, cid);
      else { H.allyReqs = H.allyReqs.filter(x=>x!==r); sys(`✋ ${pname(cid)} recusou a aliança com ${pname(m.from)}.`); }
      return sync();
    }
    case 'ally_cancel':
      H.allyReqs = H.allyReqs.filter(r=>r.from!==cid); return sync();
    case 'ally_break': {
      const a = allyOf(cid); if(!a) return;
      H.alliances = H.alliances.filter(x=>!x.includes(cid));
      sys(`💔 ${pname(cid)} rompeu a aliança com ${pname(a)}.`);
      return sync();
    }
  }
}
function resolveVote(){
  const res = {};
  for(const p of H.players){
    let v = H.votes[p.cid];
    if(v==='F'){ const a=allyOf(p.cid); const av=a ? H.votes[a] : null; v = (av==='A'||av==='R') ? av : 'R'; }
    res[p.cid] = v;
  }
  const yes = Object.values(res).filter(v=>v==='A').length;
  const approved = yes > H.players.length/2;
  const broken = H.alliances.filter(([a,b])=>res[a]!==res[b]);
  const followed = Object.keys(H.votes).filter(c=>H.votes[c]==='F');
  H.voteReveal = {votes:res, approved, yes, no:H.players.length-yes, broken, followed};
  H.history.push({round:H.round, team:H.team.slice(), votes:res, approved});
  for(const [a,b] of broken) sys(`⚠️ ${pname(a)} e ${pname(b)} são aliados, mas votaram diferente!`);
  H.phase = 'voteResult';
}
function endGame(w, reason){
  H.winner = w; H.winReason = reason; H.phase = 'end'; H.team = [];
  sys(w==='R' ? '🎉 A RESISTÊNCIA VENCEU!' : '🕵️ OS ESPIÕES VENCERAM!');
  sync();
}
const hostAct = {
  start(){
    const n = H.players.length, cfg = TABLE[n]; if(!cfg || H.phase!=='lobby') return;
    const spies = shuffle(H.players.map(p=>p.cid)).slice(0, cfg.spies);
    H.roles = {}; H.players.forEach(p => H.roles[p.cid] = spies.includes(p.cid) ? 'S' : 'R');
    H.missions = cfg.sizes.map((size,i)=>({size, two:needsTwo(n,i), result:null, fails:0}));
    Object.assign(H, {round:0, rejects:0, team:[], votes:{}, voteReveal:null, mission:{}, missionReveal:null,
      winner:null, winReason:'', history:[], alliances:[], allyReqs:[], phase:'team'});
    sys(`🎲 Partida iniciada com ${n} jogadores. Há ${cfg.spies} espiões infiltrados.`);
    sync();
  },
  team(cid){
    if(H.phase!=='team') return;
    const size = H.missions[H.round].size;
    if(H.team.includes(cid)) H.team = H.team.filter(c=>c!==cid);
    else if(H.team.length < size) H.team.push(cid);
    sync();
  },
  confirm(){
    if(H.phase!=='team' || H.team.length!==H.missions[H.round].size) return;
    sys(`🧭 Equipe da missão ${H.round+1}: ${H.team.map(pname).join(', ')}.`);
    if(H.voteOn){ H.votes={}; H.voteReveal=null; H.phase='vote'; }
    else { H.mission={}; H.phase='mission'; }
    sync();
  },
  after(){
    if(H.phase!=='voteResult') return;
    if(H.voteReveal.approved){ H.rejects=0; H.mission={}; H.phase='mission'; sys('✅ Equipe aprovada. A missão começou.'); }
    else {
      H.rejects++;
      if(H.rejects>=5) return endGame('S', 'Cinco equipes rejeitadas seguidas. O caos favoreceu os espiões.');
      sys(`❌ Equipe rejeitada (${H.rejects}/5). O mestre vai escolher outra.`);
      H.team=[]; H.phase='team';
    }
    sync();
  },
  reveal(){
    if(H.phase!=='missionDone') return;
    const cards = shuffle(Object.values(H.mission));
    const fails = cards.filter(c=>c==='F').length;
    const m = H.missions[H.round];
    const failed = fails >= (m.two ? 2 : 1);
    m.result = failed ? 'F' : 'S'; m.fails = fails;
    H.missionReveal = {round:H.round, cards, fails, failed};
    H.phase = 'missionResult';
    sys(failed ? `💥 Missão ${H.round+1} SABOTADA (${sabs(fails)}).`
               : `🏆 Missão ${H.round+1} concluída com sucesso${fails ? ` (mesmo com ${sabs(fails)})` : ''}.`);
    const s = H.missions.filter(x=>x.result==='S').length, f = H.missions.filter(x=>x.result==='F').length;
    if(s>=3) return endGame('R', 'A resistência completou 3 missões.');
    if(f>=3) return endGame('S', 'Os espiões sabotaram 3 missões.');
    sync();
  },
  next(){
    if(H.phase!=='missionResult') return;
    H.round++; H.team=[]; H.mission={}; H.missionReveal=null; H.voteReveal=null; H.phase='team';
    sync();
  },
  again(){
    Object.assign(H, {phase:'lobby', roles:{}, missions:[], team:[], winner:null, winReason:'', voteReveal:null,
      missionReveal:null, alliances:[], allyReqs:[], votes:{}, mission:{}});
    sys('🔁 Nova partida. Aguardando o mestre iniciar.');
    sync();
  },
  kick(cid){
    if(H.phase!=='lobby') return;
    H.players = H.players.filter(p=>p.cid!==cid);
    const k = keyOf[cid];
    if(k){ hnet.send(k, {t:'kicked'}); delete cidOf[k]; delete keyOf[cid]; }
    sync();
  },
  votetoggle(){ H.voteOn = !H.voteOn; sync(); },
  roles(){ hostUI.showRoles = !hostUI.showRoles; render(); },
  close(){
    if(!confirm('Encerrar a sala? Todos serão desconectados.')) return;
    store.del('resist-host'); location.href = location.pathname + (LOCAL ? '?local=1' : '');
  },
};
function startHost(code, saved){
  H = saved || newHostState(code);
  history.replaceState(null, '', '?mestre=' + H.code + (LOCAL ? '&local=1' : ''));
  mode = 'host';
  hnet = hostNet(H.code, {
    onMsg: hostOnMsg, onLeave: hostOnLeave,
    onReady(){ hostUI.ready = true; hostUI.status = ''; render(); },
    onError(msg){ hostUI.status = msg; render(); },
  });
  saveHost(); render();
}

/* ================== JOGADOR ================== */
let C = null, cnet = null;
function startPlayer(code, name){
  code = code.toUpperCase().trim(); name = name.trim().slice(0,16);
  const saved = pstore.get('resist-player');
  const cid = (saved && saved.code===code && saved.cid) || rid();
  C = { code, name, cid, s:null, status:'connecting', err:'', seen:0,
        ui:{tab:'game', showRole:false, kind:'accuse', target:'', } };
  pstore.set('resist-player', {code, name, cid});
  history.replaceState(null, '', '?sala=' + code + (LOCAL ? '&local=1' : ''));
  mode = 'player';
  cnet = clientNet(code, {
    onStatus(st){
      C.status = st;
      if(st==='open') cnet.send({t:'hello', name:C.name, cid:C.cid});
      render();
    },
    onMsg(m){
      if(!m) return;
      if(m.t==='welcome'){ C.cid = m.cid; C.err=''; pstore.set('resist-player', {code:C.code, name:C.name, cid:C.cid}); }
      else if(m.t==='state'){ C.s = m.s; C.err=''; if(C.ui.tab==='chat') markSeen(); }
      else if(m.t==='error'){ C.err = m.msg; }
      else if(m.t==='kicked'){ pstore.del('resist-player'); alert('Você foi removido da sala.'); location.href = location.pathname + (LOCAL?'?local=1':''); return; }
      render();
    },
  });
  render();
}
const send = m => cnet && cnet.send(m);
function markSeen(){ const c=C.s && C.s.chat; C.seen = c && c.length ? c[c.length-1].id : 0; }
const playerAct = {
  tab(v){ C.ui.tab = v; if(v==='chat') markSeen(); render(); window.scrollTo(0,0); },
  role(){ C.ui.showRole = !C.ui.showRole; render(); },
  vote(v){ send({t:'vote', v}); },
  mission(v){ send({t:'mission', v}); },
  kind(v){ C.ui.kind = v; render(); },
  target(v){ C.ui.target = C.ui.target===v ? '' : v; render(); },
  say(i){
    const k = C.ui.kind;
    if(k!=='say' && !C.ui.target) return;
    send({t:'chat', kind:k, i:+i, target: k==='say' ? null : C.ui.target});
    C.ui.flash = 'Enviado!'; render(); setTimeout(()=>{ C.ui.flash=''; render(); }, 1200);
  },
  allyreq(){ if(C.ui.target) send({t:'ally_req', target:C.ui.target}); },
  allyyes(from){ send({t:'ally_resp', from, accept:true}); },
  allyno(from){ send({t:'ally_resp', from, accept:false}); },
  allycancel(){ send({t:'ally_cancel'}); },
  allybreak(){ if(confirm('Romper a aliança? Todos vão ver.')) send({t:'ally_break'}); },
  leave(){ if(!confirm('Sair da sala?')) return; pstore.del('resist-player'); location.href = location.pathname + (LOCAL?'?local=1':''); },
};

function trackHTML(s){
  if(!s.missions || !s.missions.length) return '';
  const cur = ['team','vote','voteResult','mission','missionDone'].includes(s.phase) ? s.round : -1;
  return `<div class="track">${s.missions.map((m,i)=>`
    <div class="m ${m.result||''} ${i===cur?'cur':''}" title="Missão ${i+1}">
      <span>${m.result==='S'?'✓':m.result==='F'?'✗':m.size}</span><small>${m.result?(m.fails?m.fails+' sab.':''):'pessoas'}</small>
      ${m.two ? '<span class="two">2✗</span>' : ''}
    </div>`).join('')}</div>
    <div class="rej">Rejeições: ${[0,1,2,3,4].map(i=>`<i class="${i<s.rejects?'x':''}"></i>`).join('')}</div>`;
}
function nameOf(s, cid){ const p = s.players.find(p=>p.cid===cid); return p ? p.name : '?'; }
function feedHTML(s, limit){
  const list = s.chat.slice().reverse().slice(0, limit||50);
  if(!list.length) return '<p class="mute small">Nenhuma mensagem ainda.</p>';
  return `<div class="feed">${list.map(c=> c.kind==='sys'
    ? `<div class="msg sys">${esc(c.text)}</div>`
    : `<div class="msg ${c.kind}"><b>${esc(nameOf(s,c.from))}</b><span class="mute small">${KIND_LABEL[c.kind]||''}</span><div>${esc(c.text)}</div></div>`).join('')}</div>`;
}
function voteRevealHTML(s){

  return `<p><b style="color:${v.approved?'var(--ok)':'var(--spy)'};font-size:20px">${v.approved?'EQUIPE APROVADA':'EQUIPE REJEITADA'}</b>
    <span class="mute">(${v.yes} a favor × ${v.no} contra)</span></p>
    <div class="vt">${s.players.map(p=>`<span>${esc(p.name)}${v.followed.includes(p.cid)?' <span class="mute small">🔗 seguiu aliado</span>':''}</span><span>${v.votes[p.cid]==='A'?'✅ Aprovou':'❌ Rejeitou'}</span>`).join('')}</div>

function endHTML(s){

    case 'lobby':
      phase = `<h3>Aguardando o mestre</h3><p>${s.players.length} jogadores na sala.</p>
        <div class="players">${s.players.map(p=>`<div class="pl"><span class="dot ${p.on?'on':'off'}"></span><span class="nm">${esc(p.name)}${p.cid===me.cid?' (você)':''}</span></div>`).join('')}</div>`;
      break;
    case 'team':
      phase = `<h3>Missão ${s.round+1}</h3><p>O mestre está escolhendo a equipe (${s.missions[s.round].size} pessoas)…</p>
        ${s.team.length ? `<p class="mute">Até agora: ${s.team.map(c=>esc(nameOf(s,c))).join(', ')}</p>` : ''}
        <p class="small mute">Aproveite para conversar na aba Conversa.</p>`;
      break;
    case 'vote': {
      const ally = me.ally;
      phase = `<h3>Votação: missão ${s.round+1}</h3>
        <p>Equipe proposta: <b>${s.team.map(c=>esc(nameOf(s,c))).join(', ')}</b>${onTeam?' <span class="pill">você está nela</span>':''}</p>
        ${me.voted
          ? `<p>Voto enviado: <b>${me.myVote==='A'?'✅ Aprovar':me.myVote==='R'?'❌ Rejeitar':'🔗 Seguir aliado'}</b></p><p class="mute">Aguardando ${s.players.length - s.voted.length} jogador(es)…</p>`
          : `<div class="col">
              <button class="ok big" data-a="p-vote" data-v="A">✅ Aprovar equipe</button>
              <button class="danger big" data-a="p-vote" data-v="R">❌ Rejeitar equipe</button>
              ${ally ? `<button class="big" data-a="p-vote" data-v="F">🔗 Seguir meu aliado (${esc(nameOf(s,ally))})${s.voted.includes(ally)?' · já votou':''}</button>` : ''}
            </div>`}`;
      break;
    }
    case 'voteResult':
      phase = `<h3>Resultado da votação</h3>${voteRevealHTML(s)}<p class="small mute">Aguardando o mestre…</p>`;
      break;
    case 'mission':
      if(onTeam && !me.acted){
        phase = `<h3>Você está na missão ${s.round+1}!</h3><p>Escolha em segredo. Ninguém vai saber quem jogou o quê.</p>
          <div class="col">
            <button class="primary big" data-a="p-mission" data-v="S">✓ Sucesso</button>
            ${me.role==='S' ? `<button class="danger big" data-a="p-mission" data-v="F">✗ Sabotar</button>` : `<p class="small mute">Como resistência, você só pode jogar sucesso.</p>`}
          </div>`;
      } else {
        phase = `<h3>Missão ${s.round+1} em andamento</h3><p>${onTeam?'Sua carta foi enviada. ':''}Cartas recebidas: ${s.acted}/${s.team.length}</p>`;
      }
      break;
    case 'missionDone':
      phase = `<h3>Missão ${s.round+1}</h3><p>Todas as cartas chegaram. Olhe para o mestre, ele vai revelar o resultado.</p>`;
      break;
    case 'missionResult':
      phase = `<h3>Resultado da missão ${s.round+1}</h3>${missionRevealHTML(s)}`;
      break;
    case 'end':
      phase = endHTML(s);
      break;
  }
  const roleCard = me.role ? `
    <div class="role ${C.ui.showRole ? me.role : 'hid'}" data-a="p-role" role="button" aria-label="Mostrar ou esconder papel">
      ${C.ui.showRole
        ? (me.role==='S'
            ? `<div>🕵️</div><div class="t">ESPIÃO</div><p>Sabote missões sem ser descoberto.</p>${me.spies.length?`<p><b>Seus parceiros:</b> ${me.spies.map(esc).join(', ')}</p>`:''}`
            : `<div>🛡️</div><div class="t">RESISTÊNCIA</div><p>Faça as missões darem certo e descubra os espiões.</p>`)
          + '<p class="small mute">Toque para esconder</p>'
        : '<div class="t">🔒 Papel secreto</div><p class="mute">Toque para ver (cuidado com quem está olhando)</p>'}
    </div>` : '';

  // aliança
  const incoming = me.incoming.map(f=>`<div class="row" style="justify-content:space-between"><span>🤝 <b>${esc(nameOf(s,f))}</b> quer ser seu aliado</span><span class="row"><button class="chip ok" data-a="p-allyyes" data-v="${f}">Aceitar</button><button class="chip" data-a="p-allyno" data-v="${f}">Recusar</button></span></div>`).join('');
  const allyBox = (me.ally || incoming || me.outgoing.length) ? `<div class="card col">
      <h3>Aliança</h3>
      ${me.ally ? `<div class="row" style="justify-content:space-between"><span>🤝 Aliado de <b>${esc(nameOf(s,me.ally))}</b></span><button class="chip" data-a="p-allybreak">Romper</button></div><p class="small mute">Na votação você pode escolher “Seguir aliado”. Se votarem diferente, todos ficam sabendo.</p>` : ''}
      ${incoming}
      ${me.outgoing.length ? `<div class="row" style="justify-content:space-between"><span class="mute">Aguardando resposta de ${esc(nameOf(s,me.outgoing[0]))}…</span><button class="chip" data-a="p-allycancel">Cancelar</button></div>` : ''}
    </div>` : '';

  const gameTab = `
    ${roleCard ? `<div class="card" style="padding:10px">${roleCard}</div>` : ''}
    ${s.missions.length ? `<div class="card">${trackHTML(s)}</div>` : ''}
    <div class="card phase">${phase}</div>
    ${allyBox}`;

  // --- Aba Conversa
  const k = C.ui.kind;
  const needsTarget = k==='accuse' || k==='defend' || k==='ally';
  if(C.ui.target && !others.some(p=>p.cid===C.ui.target)) C.ui.target = '';
  const tname = C.ui.target ? nameOf(s, C.ui.target) : '';
  let composer = '';
  if(k==='ally'){
    composer = me.ally
      ? `<p>Você já é aliado de <b>${esc(nameOf(s,me.ally))}</b>. Rompa a aliança na aba Jogo para fazer outra.</p>`
      : `<button class="primary big" data-a="p-allyreq" ${C.ui.target && !s.alliances.some(a=>a.includes(C.ui.target))?'':'disabled'}>${C.ui.target ? `Propor aliança a ${esc(tname)}` : 'Escolha um jogador acima'}</button>
         ${C.ui.target && s.alliances.some(a=>a.includes(C.ui.target)) ? '<p class="small mute">Esse jogador já tem um aliado.</p>' : ''}
         <p class="small mute">Aliados combinam de votar igual. Se um votar diferente do outro, a quebra aparece para todos.</p>`;
  } else {
    composer = (needsTarget && !C.ui.target)
      ? '<p class="mute">Escolha um jogador acima.</p>'
      : `<div class="col">${TPL[k].map((t,i)=>`<button class="tpl" data-a="p-say" data-v="${i}">${esc(t.replace('{X}', tname))}</button>`).join('')}</div>`;
  }
  const chatTab = `
    <div class="card col">
      <div class="row">${['accuse','defend','ally','say'].map(x=>`<button class="chip ${k===x?'on':''}" data-a="p-kind" data-v="${x}">${KIND_LABEL[x]}</button>`).join('')}</div>
      ${needsTarget ? `<div><label>Jogador</label><div class="row">${others.map(p=>`<button class="chip ${C.ui.target===p.cid?'on':''}" data-a="p-target" data-v="${p.cid}">${esc(p.name)}</button>`).join('') || '<span class="mute small">Ninguém mais na sala.</span>'}</div></div>` : ''}
      ${composer}
      ${C.ui.flash ? `<p style="color:var(--ok)">${esc(C.ui.flash)}</p>` : ''}
    </div>
    <div class="card"><h3>Mensagens</h3>${feedHTML(s, 50)}</div>`;

  $app.innerHTML = `
    <div class="top">
      <div><div class="mute small">Sala ${esc(C.code)}</div><h2 style="margin:0">${esc(me.name)}</h2></div>
      <div class="row"><span class="pill"><span class="dot ${connected?'on':'off'}"></span>${esc(statusTxt)}</span><button class="chip ghost" data-a="p-leave">Sair</button></div>
    </div>
    ${C.err ? `<div class="err" style="margin-bottom:12px">${esc(C.err)}</div>` : ''}
    <div class="tabs">
      <button class="${C.ui.tab==='game'?'on':''}" data-a="p-tab" data-v="game">Jogo</button>
      <button class="${C.ui.tab==='chat'?'on':''}" data-a="p-tab" data-v="chat">Conversa${unread?`<span class="badge">${unread}</span>`:''}</button>
    </div>
    ${C.ui.tab==='game' ? gameTab : chatTab}`;
}

/* ================== Eventos ================== */
const ACTIONS = {};
for(const [k,f] of Object.entries(hostAct)) ACTIONS['h-'+k] = f;
for(const [k,f] of Object.entries(playerAct)) ACTIONS['p-'+k] = f;
for(const [k,f] of Object.entries(startAct)) ACTIONS['s-'+k] = f;
document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]');
  if(!b || b.disabled) return;
  const f = ACTIONS[b.dataset.a]; if(f) f(b.dataset.v);
});
document.addEventListener('keydown', e => {
  if(e.key==='Enter' && mode==='start' && (e.target.id==='jname' || e.target.id==='jcode')) startAct.join();
});

/* ================== Boot ================== */
(function boot(){
  const m = Q.get('mestre'), sala = Q.get('sala');
  if(m){ const s = store.get('resist-host'); if(s && s.code===m.toUpperCase()) return startHost(s.code, s); }
  if(sala){ const p = pstore.get('resist-player'); if(p && p.code===sala.toUpperCase() && p.name) return startPlayer(p.code, p.name); }
  render();
})();
</script>
</body>
</html>
